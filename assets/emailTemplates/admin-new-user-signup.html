<!DOCTYPE html>
<html>
<head>
    <meta charset="utf-8">
</head>
<body style="margin: 0; padding: 20px; font-family: Arial, sans-serif; background-color: #f7f7f7;">
    <div style="font-family: Arial, sans-serif; padding: 20px; max-width: 600px; margin: 0 auto; background-color: #ffffff; border: 1px solid #eee; border-radius: 10px;">
        <div style="background-color: #1a1a1a; padding: 20px; border-radius: 8px 8px 0 0; text-align: center;">
            <h1 style="color: #C59A2F; margin: 0; font-size: 28px; letter-spacing: 2px;">ATHITHYA ADMIN</h1>
        </div>
        <div style="padding: 20px;">
            <h2 style="color: #333; margin-top: 0;">New User Signup{{sourceSuffix}}</h2>
            <p style="color: #555; font-size: 16px; line-height: 1.6;">
                <strong>{{username}}</strong> has signed up or created a new account as a <strong>{{role}}</strong> in Athithya.
            </p>
            <table style="width: 100%; border-collapse: collapse; margin-top: 20px;">
                <tr style="background-color: #f9f9f9;">
                    <td style="padding: 10px; border: 1px solid #ddd; font-weight: bold; width: 40%;">Name:</td>
                    <td style="padding: 10px; border: 1px solid #ddd;">{{username}}</td>
                </tr>
                <tr>
                    <td style="padding: 10px; border: 1px solid #ddd; font-weight: bold;">Email:</td>
                    <td style="padding: 10px; border: 1px solid #ddd;">{{email}}</td>
                </tr>
                <tr style="background-color: #f9f9f9;">
                    <td style="padding: 10px; border: 1px solid #ddd; font-weight: bold;">Role:</td>
                    <td style="padding: 10px; border: 1px solid #ddd; text-transform: uppercase;">{{role}}</td>
                </tr>
                <tr>
                    <td style="padding: 10px; border: 1px solid #ddd; font-weight: bold;">Registered At:</td>
                    <td style="padding: 10px; border: 1px solid #ddd;">{{registeredAt}}</td>
                </tr>
            </table>
        </div>
    </div>
</body>
</html>
