<!DOCTYPE html>
<html>
<head>
    <meta charset="utf-8">
    <title>Experience Hide Request</title>
</head>
<body style="font-family: Arial, sans-serif; margin: 0; padding: 20px; background-color: #f7f7f7;">
    <div style="font-family: Arial, sans-serif; padding: 20px; max-width: 600px; margin: 0 auto; border: 1px solid #eee; border-radius: 10px; background-color: #ffffff;">
        <div style="background-color: #1a1a1a; padding: 20px; border-radius: 8px 8px 0 0; text-align: center;">
            <h1 style="color: #C59A2F; margin: 0; font-size: 28px; letter-spacing: 2px;">ATHITHYA</h1>
        </div>
        <div style="padding: 20px;">
            <h2 style="color: #C59A2F; margin-top: 0;">Experience Hide Request</h2>
            <p style="color: #333; font-size: 15px;">Host <strong>{{hostName}}</strong> has requested to hide their experience <strong>"{{title}}"</strong>.</p>
            <div style="background-color: #f9f9f9; padding: 15px; border-radius: 8px; border: 1px solid #eee; margin-top: 15px;">
                <strong style="color: #C59A2F;">Host Reason:</strong>
                <p style="margin: 5px 0 0 0; color: #555; font-size: 14px; white-space: pre-wrap;">"{{reason}}"</p>
            </div>
            <p style="color: #777; font-size: 12px; margin-top: 20px;">Please log in to the admin panel to review and approve or reject this request.</p>
        </div>
    </div>
</body>
</html>
